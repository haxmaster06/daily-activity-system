# Deployment DAMS — Docker Compose.
#
# Seluruh port yang dipublikasikan berada di rentang 13xxx (PRD §8) agar tidak
# bentrok dengan layanan lain di server.
#
# Migration TIDAK dijalankan otomatis. Setelah `up`, jalankan sebagai langkah
# tersendiri sesudah backup terverifikasi:
#
#     docker compose exec backend php artisan migrate --force
#
# `migrate:fresh` / `migrate:refresh` / `db:wipe` dilarang tanpa izin —
# lihat docs/adr/ADR-008-larangan-fresh-migrate.md
#
# ---------------------------------------------------------------------------
# Berkas unggahan berada di luar Docker
# ---------------------------------------------------------------------------
#
# Lampiran laporan, foto profil, berkas export, dan cadangan basis data tersimpan
# di `DAMS_STORAGE_PATH` pada host — bawaannya
# `/mnt/raw-backup/app_data_storage/hbm-daily-activity`.
#
# **Bind mount, bukan named volume.** Named volume hidup di dalam wilayah Docker
# (`/var/lib/docker/volumes`), yang tidak ikut tersalin oleh pencadangan server
# dan lenyap bersama `docker volume prune` yang dijalankan orang lain. Lampiran
# laporan tidak dapat dibuat ulang dari mana pun.
#
# **Bind mount, bukan symbolic link di dalam container.** Symlink di dalam
# container tetap menunjuk ke jalur di dalam container; sasarannya baru ada bila
# jalur itu sendiri sudah di-mount. Dengan bind mount, satu baris di sini sudah
# menjadi keduanya.
#
# Direktorinya wajib dapat ditulis uid 82 (`www-data` pada image Alpine ini).
# Sekali saja, di server:
#
#     sudo mkdir -p /mnt/raw-backup/app_data_storage/hbm-daily-activity/{storage-app,backup}
#     sudo chown -R 82:82 /mnt/raw-backup/app_data_storage/hbm-daily-activity
#
# Rincian dan pemeriksaannya di docs/panduan-deployment.md.
#
# ---------------------------------------------------------------------------
# Satu pintu masuk
# ---------------------------------------------------------------------------
#
# Hanya `proxy` yang dipublikasikan ke seluruh antarmuka. Layanan lain diikat ke
# 127.0.0.1 — masih dapat diperiksa dari dalam server lewat SSH, tetapi tidak
# terjangkau dari internet. MySQL dan Redis yang terbuka ke publik melanggar
# non-fungsional §13.
#
# ---------------------------------------------------------------------------
# Nama container ditulis eksplisit
# ---------------------------------------------------------------------------
#
# Server ini dipakai bersama puluhan container project lain, sebagian bernama
# generik seperti `db` dan `redis`. Awalan `dams-` membuat tiap container dapat
# dikenali pemiliknya, dan `name: dams` di bawah menjaga nama project Compose
# tetap sama walau direktori kerjanya dipindah atau diganti nama.

# ---------------------------------------------------------------------------
# `network: host` pada tiap tahap build
# ---------------------------------------------------------------------------
#
# Hanya berlaku saat MEMBANGUN image; container yang berjalan tetap memakai
# jaringan `dams-net` yang terisolasi.
#
# Docker menyalin daftar nameserver host apa adanya ke tiap container. Di server
# ini daftarnya memuat 10.10.10.1, yang tidak terjangkau dari namespace jaringan
# container: resolver musl menunggu 15 detik pada tiap kegagalan, dan `apk`
# menyerah lebih dulu dengan "DNS: transient error (try again later)". Build
# gagal di tengah `docker-php-ext-install`.
#
# Host sendiri tidak terpengaruh karena memakai systemd-resolved di 127.0.0.53.
# Dengan `network: host`, tahap build ikut memakai resolver itu — `apk add`
# selesai dalam hitungan detik.
#
# Perbaikan yang lebih mendasar adalah membuang 10.10.10.1 dari konfigurasi DNS
# daemon Docker, tetapi itu menuntut daemon di-restart, dan server ini
# menjalankan puluhan container milik project lain.

name: dams

x-storage-unggahan: &storage-unggahan
  # Lampiran, foto profil, dan berkas export — bertahan lintas deployment.
  - ${DAMS_STORAGE_PATH:-/mnt/raw-backup/app_data_storage/hbm-daily-activity}/storage-app:/var/www/html/storage/app
  # Cadangan basis data, ditulis `dams:backup` lewat scheduler.
  - ${DAMS_STORAGE_PATH:-/mnt/raw-backup/app_data_storage/hbm-daily-activity}/backup:/var/backup/dams

services:
  db:
    image: mysql:8.0
    container_name: dams-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-dams_db}
      MYSQL_USER: ${DB_USERNAME:-dams}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD wajib diisi di .env}
      TZ: Asia/Jakarta
    ports:
      - '127.0.0.1:13306:3306'
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-p${DB_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [dams]

  redis:
    image: redis:7-alpine
    container_name: dams-redis
    restart: unless-stopped
    # Batas memori wajib pada server yang dipakai bersama: tanpa itu Redis
    # tumbuh sampai OOM killer yang memilih korbannya, dan korbannya belum
    # tentu Redis.
    #
    # `volatile-lru`, bukan `allkeys-lru`. Satu instance ini melayani antrean
    # sekaligus cache. `allkeys-lru` boleh membuang kunci apa pun saat penuh —
    # termasuk job antrean, yang tidak punya TTL dan tidak dapat dibuat ulang;
    # notifikasi dan berkas export akan hilang tanpa satu pun pesan galat.
    # `volatile-lru` hanya menyentuh kunci ber-TTL, dan seluruh penulis cache
    # di aplikasi ini memakai TTL.
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
    ports:
      - '127.0.0.1:13379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [dams]

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      network: host
    container_name: dams-backend
    restart: unless-stopped
    env_file: [.env]
    environment:
      DB_HOST: db
      DB_PORT: '3306'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      # Alamat Reverb dari sisi server, bukan dari peramban.
      #
      # Ini yang dipakai backend untuk MENGIRIM siaran. Peramban memakai alamat
      # publik yang ditanam saat build frontend — keduanya berbeda, dan
      # menyamakannya membuat backend menghubungi dirinya lewat jalan memutar
      # keluar server.
      REVERB_HOST: reverb
      REVERB_PORT: '8080'
      REVERB_SCHEME: http
    # Tidak dipublikasikan ke internet. Peramban tidak pernah memanggil backend
    # secara langsung (ADR-002, ADR-005) — seluruh permintaannya lewat Route
    # Handler Next.js. Port ini hanya untuk pemeriksaan dari dalam server.
    ports:
      - '127.0.0.1:13002:8000'
    volumes: *storage-unggahan
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [dams]

  queue:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      network: host
    container_name: dams-queue
    restart: unless-stopped
    env_file: [.env]
    environment:
      DB_HOST: db
      DB_PORT: '3306'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    # Proses berat (export Excel/PDF) dikerjakan di sini, bukan di request utama
    entrypoint: ['php', 'artisan', 'queue:work', '--tries=3', '--timeout=300', '--sleep=3']
    # Menimpa HEALTHCHECK milik image, yang menguji port 8000 — port itu tidak
    # pernah terbuka di sini sebab entrypointnya bukan nginx. Tanpa penggantian
    # ini container selalu dilaporkan unhealthy walau bekerja normal.
    #
    # Yang diperiksa jangkauan Redis, bukan hidupnya proses. Proses yang mati
    # sudah ditangani `restart`, sedangkan worker yang hidup tetapi tidak dapat
    # menghubungi Redis adalah kegagalan senyap: antrean menumpuk, notifikasi
    # dan export tidak pernah selesai, dan tidak ada satu pun pesan galat.
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "$$r = new Redis(); $$r->connect(getenv('REDIS_HOST'), 6379); exit($$r->ping() ? 0 : 1);"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes: *storage-unggahan
    depends_on:
      backend: { condition: service_started }
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [dams]

  # Penjadwal — cadangan basis data dan uji restore.
  #
  # routes/console.php menjadwalkan `dams:backup` dan `dams:uji-restore`, dan
  # keduanya tidak akan pernah berjalan tanpa proses yang memanggilnya. Itu
  # justru berbahaya di project ini: ADR-008 melarang reset basis data, sehingga
  # cadangan adalah satu-satunya jalan pulih bila terjadi kesalahan data.
  #
  # Container tersendiri, bukan proses tambahan di dalam `queue`: worker antrean
  # dimatikan dan dinyalakan ulang saat penyebaran, dan penjadwal yang menumpang
  # padanya akan ikut kehilangan jendela waktunya.
  scheduler:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      network: host
    container_name: dams-scheduler
    restart: unless-stopped
    env_file: [.env]
    environment:
      DB_HOST: db
      DB_PORT: '3306'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    entrypoint: ['php', 'artisan', 'schedule:work']
    # Alasan yang sama seperti pada `queue` — lihat catatan di sana.
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "$$r = new Redis(); $$r->connect(getenv('REDIS_HOST'), 6379); exit($$r->ping() ? 0 : 1);"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes: *storage-unggahan
    depends_on:
      backend: { condition: service_started }
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [dams]

  # Reverb — WebSocket notifikasi seketika.
  #
  # Container tersendiri, bukan proses tambahan di dalam backend: sambungan
  # WebSocket berumur panjang, sedangkan container backend dimatikan dan
  # dinyalakan ulang tiap deployment. Memisahkannya membuat penyebaran ulang
  # backend tidak memutus sambungan semua orang.
  reverb:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      network: host
    container_name: dams-reverb
    restart: unless-stopped
    env_file: [.env]
    environment:
      DB_HOST: db
      DB_PORT: '3306'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: '8080'
    entrypoint: ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8080']
    # Menimpa HEALTHCHECK milik image yang menguji port 8000. Yang dilayani di
    # sini 8080, dan socket yang menerima sambungan adalah tanda sehat yang
    # sebenarnya bagi server WebSocket.
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '8080']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Peramban menyambung lewat pintu (/app/), bukan ke port ini. Dipublikasikan
    # hanya ke 127.0.0.1 untuk pemeriksaan langsung dari dalam server.
    ports:
      - '127.0.0.1:13003:8080'
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [dams]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      network: host
      # NEXT_PUBLIC_* ditanam ke dalam bundel saat build, bukan dibaca saat
      # container berjalan. Mengubahnya menuntut build ulang frontend.
      args:
        NEXT_PUBLIC_REVERB_KEY: ${REVERB_APP_KEY:?REVERB_APP_KEY wajib diisi di .env}
        NEXT_PUBLIC_REVERB_HOST: ${REVERB_PUBLIC_HOST:?REVERB_PUBLIC_HOST wajib diisi di .env}
        NEXT_PUBLIC_REVERB_PORT: ${REVERB_PUBLIC_PORT:-443}
        NEXT_PUBLIC_REVERB_SCHEME: ${REVERB_PUBLIC_SCHEME:-https}
    container_name: dams-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Dipakai Route Handler Next.js untuk memanggil API di jaringan internal
      BACKEND_INTERNAL_URL: http://backend:8000
      # Flag `secure` pada cookie token. Dibaca saat container berjalan — tanpa
      # awalan NEXT_PUBLIC_, jadi cukup restart tanpa membangun ulang bundel.
      #
      # Wajib 'false' selama aplikasi dilayani http polos: peramban menolak
      # menyimpan cookie ber-flag Secure di atas http, dan gejalanya menyesatkan
      # — login membalas 200, lalu tiap halaman melempar balik ke /login.
      DAMS_COOKIE_SECURE: ${DAMS_COOKIE_SECURE:-true}
    # Tanpa `ports`. Frontend hanya dijangkau lewat pintu, sehingga aplikasi
    # benar-benar punya satu alamat masuk.
    depends_on:
      backend: { condition: service_started }
    networks: [dams]

  # Pintu tunggal. Satu-satunya layanan yang terjangkau dari luar server.
  #
  # Port host mengikuti port bawaan frontend (PRD §8) karena itu yang dibuka di
  # firewall untuk fase QA. Yang berubah hanyalah siapa yang mendengarkannya:
  # nginx, bukan Next.js langsung — sebab WebSocket Reverb harus berbagi alamat
  # yang sama agar tidak ada port kedua yang perlu dibuka.
  proxy:
    image: nginx:1.27-alpine
    container_name: dams-proxy
    restart: unless-stopped
    ports:
      - '13001:80'
    volumes:
      - ./docker/nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend: { condition: service_started }
      backend: { condition: service_started }
      reverb: { condition: service_started }
    networks: [dams]

volumes:
  db_data:
    name: dams-db-data
  redis_data:
    name: dams-redis-data

networks:
  dams:
    name: dams-net
    driver: bridge
