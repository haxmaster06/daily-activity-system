# Deployment DAMS — Docker Compose.
#
# Seluruh port yang dipublikasikan berada di rentang 13xxx (PRD §8) agar tidak
# bentrok dengan layanan lain di server.
#
# Migration TIDAK dijalankan otomatis. Setelah `up`, jalankan sebagai langkah
# tersendiri sesudah backup terverifikasi:
#
#     docker compose exec backend php artisan migrate --force
#
# `migrate:fresh` / `migrate:refresh` / `db:wipe` dilarang tanpa izin —
# lihat docs/adr/ADR-008-larangan-fresh-migrate.md
#
# ---------------------------------------------------------------------------
# Berkas unggahan berada di luar Docker
# ---------------------------------------------------------------------------
#
# Lampiran laporan, foto profil, berkas export, dan cadangan basis data tersimpan
# di `DAMS_STORAGE_PATH` pada host — bawaannya
# `/mnt/raw-backup/app_data_storage/hbm-daily-activity`.
#
# **Bind mount, bukan named volume.** Named volume hidup di dalam wilayah Docker
# (`/var/lib/docker/volumes`), yang tidak ikut tersalin oleh pencadangan server
# dan lenyap bersama `docker volume prune` yang dijalankan orang lain. Lampiran
# laporan tidak dapat dibuat ulang dari mana pun.
#
# **Bind mount, bukan symbolic link di dalam container.** Symlink di dalam
# container tetap menunjuk ke jalur di dalam container; sasarannya baru ada bila
# jalur itu sendiri sudah di-mount. Dengan bind mount, satu baris di sini sudah
# menjadi keduanya.
#
# Direktorinya wajib dapat ditulis uid 82 (`www-data` pada image Alpine ini).
# Sekali saja, di server:
#
#     sudo mkdir -p /mnt/raw-backup/app_data_storage/hbm-daily-activity/{storage-app,backup}
#     sudo chown -R 82:82 /mnt/raw-backup/app_data_storage/hbm-daily-activity
#
# Rincian dan pemeriksaannya di docs/panduan-deployment.md.

x-storage-unggahan: &storage-unggahan
  # Lampiran, foto profil, dan berkas export — bertahan lintas deployment.
  - ${DAMS_STORAGE_PATH:-/mnt/raw-backup/app_data_storage/hbm-daily-activity}/storage-app:/var/www/html/storage/app
  # Cadangan basis data, ditulis `dams:backup` lewat scheduler.
  - ${DAMS_STORAGE_PATH:-/mnt/raw-backup/app_data_storage/hbm-daily-activity}/backup:/var/backup/dams

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-dams_db}
      MYSQL_USER: ${DB_USERNAME:-dams}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD wajib diisi di .env}
      TZ: Asia/Jakarta
    ports:
      - '13306:3306'
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-p${DB_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [dams]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '13379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [dams]

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      DB_HOST: db
      DB_PORT: '3306'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      # Alamat Reverb dari sisi server, bukan dari peramban.
      #
      # Ini yang dipakai backend untuk MENGIRIM siaran. Peramban memakai alamat
      # publik yang ditanam saat build frontend — keduanya berbeda, dan
      # menyamakannya membuat backend menghubungi dirinya lewat jalan memutar
      # keluar server.
      REVERB_HOST: reverb
      REVERB_PORT: '8080'
      REVERB_SCHEME: http
    ports:
      - '13002:8000'
    volumes: *storage-unggahan
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [dams]

  queue:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      DB_HOST: db
      DB_PORT: '3306'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    # Proses berat (export Excel/PDF) dikerjakan di sini, bukan di request utama
    entrypoint: ['php', 'artisan', 'queue:work', '--tries=3', '--timeout=300', '--sleep=3']
    volumes: *storage-unggahan
    depends_on:
      backend: { condition: service_started }
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [dams]

  # Reverb — WebSocket notifikasi seketika.
  #
  # Container tersendiri, bukan proses tambahan di dalam backend: sambungan
  # WebSocket berumur panjang, sedangkan container backend dimatikan dan
  # dinyalakan ulang tiap deployment. Memisahkannya membuat penyebaran ulang
  # backend tidak memutus sambungan semua orang.
  reverb:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      DB_HOST: db
      DB_PORT: '3306'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: '8080'
    entrypoint: ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8080']
    ports:
      - '13003:8080'
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [dams]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      # NEXT_PUBLIC_* ditanam ke dalam bundel saat build, bukan dibaca saat
      # container berjalan. Mengubahnya menuntut build ulang frontend.
      args:
        NEXT_PUBLIC_REVERB_KEY: ${REVERB_APP_KEY:?REVERB_APP_KEY wajib diisi di .env}
        NEXT_PUBLIC_REVERB_HOST: ${REVERB_PUBLIC_HOST:?REVERB_PUBLIC_HOST wajib diisi di .env}
        NEXT_PUBLIC_REVERB_PORT: ${REVERB_PUBLIC_PORT:-443}
        NEXT_PUBLIC_REVERB_SCHEME: ${REVERB_PUBLIC_SCHEME:-https}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Dipakai Route Handler Next.js untuk memanggil API di jaringan internal
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - '13001:3000'
    depends_on:
      backend: { condition: service_started }
    networks: [dams]

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '13080:80'
      - '13443:443'
    volumes:
      - ./docker/nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      frontend: { condition: service_started }
      backend: { condition: service_started }
      reverb: { condition: service_started }
    networks: [dams]

volumes:
  db_data:
  redis_data:

networks:
  dams:
    driver: bridge
