# Reverse proxy DAMS — satu pintu masuk untuk frontend dan API.

upstream dams_frontend {
    server frontend:3000;
}

upstream dams_backend {
    server backend:8000;
}

upstream dams_reverb {
    server reverb:8080;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 12M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API Laravel
    location /api/ {
        proxy_pass http://dams_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # WebSocket notifikasi (Reverb).
    #
    # Lewat proxy yang sama dengan aplikasinya, bukan port tersendiri: satu
    # sertifikat, satu asal, dan tidak ada port tambahan yang harus dibuka di
    # firewall. Peramban menyambung ke wss://<domain>/app/<kunci>.
    location /app/ {
        proxy_pass http://dams_reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sambungan WebSocket menganggur di antara notifikasi. Batas waktu
        # bawaan 60 detik akan memutusnya terus-menerus, dan tiap pemutusan
        # memaksa peramban menyambung ulang beserta otorisasi channelnya.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Berkas lampiran yang dilayani Laravel (tetap lewat pemeriksaan izin)
    location /storage/ {
        proxy_pass http://dams_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sisanya ditangani Next.js
    location / {
        proxy_pass http://dams_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    access_log /dev/stdout;
    error_log /dev/stderr warn;
}
