# Reverse proxy DAMS — satu pintu masuk.
#
# ---------------------------------------------------------------------------
# `/api/` adalah milik Next.js, BUKAN backend
# ---------------------------------------------------------------------------
#
# Menggoda sekali menaruh `location /api/ { proxy_pass backend; }` di sini, dan
# itu justru mematahkan aplikasinya. Peramban memanggil `/api/auth/login`,
# `/api/notifikasi`, `/api/broadcasting/auth`, `/api/lampiran/{id}` — seluruhnya
# Route Handler Next.js, bukan rute Laravel. Route Handler itulah yang membaca
# token dari cookie httpOnly lalu memasangnya sebagai bearer header sebelum
# meneruskan ke backend (frontend/src/lib/api.ts).
#
# Backend memang punya `/api/login`, `/api/notifikasi`, dan seterusnya, tetapi
# jalur peramban tidak pernah sama persis dan permintaannya tidak membawa
# bearer header sama sekali. Mengarahkan `/api/` ke backend membuat login
# membalas 404 dan seluruh pemanggilan lain 401.
#
# Peramban tidak pernah memanggil backend secara langsung (ADR-002, ADR-005).
# Karena itu hanya `/app/` dan `/storage/` yang dipisahkan di sini; sisanya —
# termasuk seluruh `/api/` — milik Next.js.

upstream dams_frontend {
    server frontend:3000;
}

upstream dams_backend {
    server backend:8000;
}

upstream dams_reverb {
    server reverb:8080;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 12M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # WebSocket notifikasi (Reverb).
    #
    # Lewat proxy yang sama dengan aplikasinya, bukan port tersendiri: satu
    # sertifikat, satu asal, dan tidak ada port tambahan yang harus dibuka di
    # firewall. Peramban menyambung ke wss://<domain>/app/<kunci>.
    location /app/ {
        proxy_pass http://dams_reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sambungan WebSocket menganggur di antara notifikasi. Batas waktu
        # bawaan 60 detik akan memutusnya terus-menerus, dan tiap pemutusan
        # memaksa peramban menyambung ulang beserta otorisasi channelnya.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Berkas lampiran yang dilayani Laravel (tetap lewat pemeriksaan izin)
    location /storage/ {
        proxy_pass http://dams_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sisanya ditangani Next.js — halaman, aset, dan seluruh Route Handler
    # `/api/*` beserta jalur lanjutannya ke backend.
    #
    # ---------------------------------------------------------------------
    # `$http_host`, BUKAN `$host` — Server Action bergantung padanya
    # ---------------------------------------------------------------------
    #
    # Next.js menjaga Server Action dari CSRF dengan mencocokkan header
    # `Origin` terhadap host yang diteruskan proxy. `$host` membuang nomor
    # port, sedangkan `Origin` dari peramban selalu membawanya. Selama
    # aplikasi dilayani di port bukan 80/443, keduanya tidak akan pernah
    # cocok:
    #
    #     x-forwarded-host: 36.92.42.135        (dari $host)
    #     origin:           36.92.42.135:13001  (dari peramban)
    #     → Invalid Server Actions request, HTTP 500
    #
    # Yang gagal bukan satu halaman, melainkan setiap form yang menyimpan
    # lewat Server Action. `$http_host` meneruskan Host apa adanya, lengkap
    # dengan portnya.
    #
    # `X-Forwarded-Host` disetel sendiri, bukan dibiarkan lewat: nginx
    # meneruskan header klien yang tidak dikenal apa adanya, sehingga tanpa
    # baris ini peramban mana pun dapat menyodorkan host palsu.
    location / {
        proxy_pass http://dams_frontend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Export dan import melewati jalur ini: peramban menunggu Next.js, yang
        # menunggu backend menyusun berkasnya. Batas bawaan 60 detik memutus
        # pratinjau export yang besar di tengah jalan.
        proxy_read_timeout 120s;
    }

    access_log /dev/stdout;
    error_log /dev/stderr warn;
}
