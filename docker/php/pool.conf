; Pool PHP-FPM DAMS.
;
; Bawaan image php-fpm hanya mengizinkan 5 proses sekaligus. Satu halaman DAMS
; menembak tiga panggilan API bersamaan, jadi dua pengguna yang membuka halaman
; pada saat yang sama sudah menghabiskan jatahnya dan sisanya antre.
;
; Yang membatasi jumlah proses adalah RAM, bukan core: tiap proses menahan satu
; aplikasi Laravel penuh, sekitar 40-80 MB. Menaikkannya melebihi RAM membuat
; server bertukar ke disk, dan itu jauh lebih lambat daripada antre.

[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

; Nilai di bawah ditulis ulang entrypoint dari PHP_FPM_MAX_CHILDREN.
; Tidak memakai ${VAR} langsung: PHP-FPM tidak menjamin menguraikannya, dan
; bila gagal container tidak menyala sama sekali — kegagalan yang baru
; ketahuan saat deployment.
pm = dynamic
pm.max_children = 8
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5

; Proses didaur ulang berkala. Kebocoran memori sekecil apa pun menumpuk pada
; proses yang hidup berhari-hari.
pm.max_requests = 500

; Permintaan yang menggantung dicatat lengkap dengan jejaknya, bukan hanya
; dilaporkan lambat.
request_slowlog_timeout = 10s
slowlog = /proc/self/fd/2

catch_workers_output = yes
decorate_workers_output = no
clear_env = no
