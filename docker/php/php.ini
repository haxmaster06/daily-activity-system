; Konfigurasi PHP untuk container backend DAMS

; Lampiran maksimal 10MB per berkas (non-fungsional §8)
upload_max_filesize = 10M
post_max_size = 12M
max_file_uploads = 10

memory_limit = 256M
max_execution_time = 60

; Detail teknis tidak boleh tampil ke pengguna — hanya masuk log
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

expose_php = Off

date.timezone = Asia/Jakarta
