# Vhost Apache2 untuk https://daily.hbmnet.co.id
#
# BERKAS INI TIDAK DIBACA SIAPA PUN DARI SINI. Ia salinan dari yang benar-benar
# berlaku di host, disimpan supaya deployment ini dapat diulang dan perubahannya
# terlacak. Yang dijalankan Apache adalah:
#
#     /etc/apache2/sites-available/daily.hbmnet.co.id.conf
#
# Memasang atau memperbaruinya:
#
#     sudo cp docker/apache/daily.hbmnet.co.id.conf /etc/apache2/sites-available/
#     sudo a2ensite daily.hbmnet.co.id.conf
#     sudo apache2ctl configtest        # WAJIB — satu berkas salah mematikan
#     sudo systemctl reload apache2     # seluruh ~20 situs di server ini
#
# `reload`, bukan `restart`: reload tidak memutus sambungan situs lain.
#
# Modul yang dibutuhkan (seluruhnya sudah aktif di server ini):
#     proxy proxy_http proxy_wstunnel headers ssl rewrite
#
#
# Deret proxy sampai ke aplikasi:
#
#   Peramban -> Cloudflare -> Apache2 (berkas ini) -> nginx :13001 -> Next.js
#                                                                  -> Reverb
#
# Apache hanya meneruskan; seluruh pemisahan jalur sudah dikerjakan nginx milik
# DAMS di docker/nginx/proxy.conf. Karena itu di sini cukup satu ProxyPass untuk
# seluruh pohon jalur — memecahnya di dua tempat membuat aturannya berbeda
# diam-diam.

<VirtualHost *:80>
    ServerName daily.hbmnet.co.id

    # Dibiarkan terbuka untuk tantangan ACME bila kelak sertifikat Let's Encrypt
    # diterbitkan untuk domain ini.
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory /var/www/html/.well-known/acme-challenge/>
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/?(.*) https://daily.hbmnet.co.id/$1 [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/dams_error.log
    CustomLog ${APACHE_LOG_DIR}/dams_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName daily.hbmnet.co.id

    SSLEngine               on
    SSLCertificateFile      /home/hbm-server/ssl/fullchain.pem
    SSLCertificateKeyFile   /home/hbm-server/ssl/privkey.pem
    SSLProtocol             -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder     off
    SSLSessionTickets       off

    Protocols h2 http/1.1
    H2WindowSize 5242880

    # Lampiran paling besar 10 MB; batas nginx 12 MB. Disamakan supaya berkas
    # yang terlalu besar ditolak oleh aplikasi dengan pesan berbahasa Indonesia,
    # bukan oleh proxy dengan halaman galat Apache.
    LimitRequestBody 12582912

    ProxyPreserveHost On
    ProxyRequests Off

    # ---------------------------------------------------------------------
    # Header yang WAJIB, bukan pelengkap
    # ---------------------------------------------------------------------
    #
    # Sambungan Apache ke nginx berjalan http polos. Tanpa dua baris ini nginx
    # dan Next.js menyimpulkan permintaannya http, lalu Origin peramban
    # (https://daily.hbmnet.co.id) tidak cocok dengan yang dihitung Next.js
    # sendiri — dan SETIAP Server Action dijawab 500. Bukan satu halaman,
    # melainkan tiap form yang menyimpan.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # WebSocket notifikasi (Reverb) berbagi jalur yang sama, di /app/.
    # `upgrade=websocket` membuat mod_proxy_http meneruskan Upgrade alih-alih
    # menutupnya, sehingga tidak perlu ProxyPass terpisah untuk ws://.
    ProxyPass        / http://127.0.0.1:13001/ upgrade=websocket timeout=120
    ProxyPassReverse / http://127.0.0.1:13001/

    ErrorLog ${APACHE_LOG_DIR}/dams_error.log
    CustomLog ${APACHE_LOG_DIR}/dams_access.log combined
</VirtualHost>
